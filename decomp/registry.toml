# section 1 "MASTER FUNCTION INDEX" (the 243-fn consolidation of the 8 atlases).
# Status ladder (plan section 2): RAW -> NAMED -> DRAFT -> MATCHED -> LOCKED.
#   All seeded entries start at NAMED (atlas role known, no C written).
# Fields per [[fn]]:
#   addr       = guest address (0x-prefixed, uppercase)
#   module     = "game" (0x88, reco_normal.img.bin) | "shell" (0x82, default.img.bin)
#   name       = current symbol (recomp default sub_XXXXXXXX until a Namespace_VerbNoun name is assigned at DRAFT)
#   role       = atlas role wording (verbatim; keep the shared vocabulary)
#   status     = ladder position
#   provenance = atlas reference(s) with confidence tags, from the master index row
#   file       = decomp/ source file once DRAFT ("" until then)
#   gate       = acceptance gate once assigned per plan section 3.3 ("" until then)

