# Jump-table overrides for reco_normal.xex game module.
# Generated by sweeping out_reco/ppc_recomp.*.cpp for computed-jump-table bctr sites
# whose table data was mis-decoded as instructions (XenonAnalyse found 0 tables).
# Each entry: base = bctr guest address (table starts at base+4), r = index register,
# labels = case targets in index order, decoded from the mis-decoded comment lines
# following the bctr (high16 = enclosing function's own code-region high16, low16 = raw
# offset field from the mis-decoded load/store instruction comment).
#
# Table @ 0x8824E6D0 (sub_8824E698, GameEntry dispatcher) and 0x880EC87C (sub_880EC758)
# were manually identified/verified first; the rest were found by an automated sweep
# and cross-checked. r = the register operand of the "rlwinm rX,rY,2,0,29" that scales
# the case index right before the lwzx/mtctr/bctr (verified against Table B's SDK ground
# truth: register=11 there is the rotlwi-copy destination, not the earlier cmplwi-tested
# r10 -- so we key off the register literally read by rlwinm, not traced further back).
# Each table entry is recovered by reconstructing the full 32-bit PPC D-form instruction
# word (opcode<<26 | rD<<21 | rA<<16 | imm16) from the mis-decoded comment's mnemonic +
# operand fields -- NOT by reusing the enclosing function's own high-16 bits, which is
# only coincidentally correct when every mis-decoded entry happens to disassemble as an
# lbz (opcode 34 == top byte 0x88). One table (sub_881EF798) mixed lbz on r30 with lbz
# on r31 for a few entries; the high16-reuse hack silently produced 5 wrong-but-in-range
# addresses there (0x881E0xxx instead of the correct 0x881F0xxx, still inside the same
# function) until full-word reconstruction was used instead.
# All decoded targets land in [0x88070000,0x8824EEB0) and are 4-byte aligned.
#
# NOTE (2026-07-05): the byte-map (lbzx/lhzx -> scale -> ADD) tables DO fit the schema
# after all -- XenonRecomp uses `labels` verbatim keyed on `r`, so we supply the SDK's
# already-FLATTENED per-index final targets and key on the BOUND-CHECK register (r31/r11,
# the cmplwi operand), NOT the rlwinm-scaled reg. Three such tables are now resolved at
# the END of this file: sub_8807D838 (the r1-leak that corrupted the game-main spawn ctx),
# sub_8808B330, and sub_880714E0 (a 56-case lhzx/halfword-map variant found by the
# completeness sweep). All three cross-verified against the working SDK oracle
# (futari_recomp/generated/reco_normal) + adversarially confirmed case-by-case.

